name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.19, 22.12]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build the addon
        run: npm run build

      # Builds the development Storybook in src/stories against the freshly
      # built addon. Catches the failure that matters most here: a panel that
      # compiles but throws once Storybook loads it.
      - name: Build the development Storybook
        run: npm run build-storybook
